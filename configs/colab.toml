# Google Colab example config.
# Edit base_dir/model_root depending on where you put the datasets and outputs.

[train]
dataset = "dataset_drac"
augment = true
aug_multiplier = 10
base_dir = "."                         # Folder containing dataset_tu/ and dataset_drac/
k_folds = 5
epochs = 100
batch_size = 8
lr = 0.0001
use_amp = true
use_scheduler = true
scheduler_factor = 0.5
scheduler_patience = 3
min_lr = 0.0000001
patience = 30
num_workers = 2
threshold = 0.5
seed = 42
model_root = "/content/drive/MyDrive/rnv_pipeline/model"
required_conda_env = ""
experiment_name = ""

[visualize]
dataset = "dataset_drac"
base_dir = "."
k_folds = 5
batch_size = 1
threshold = 0.5
use_amp = true
model_root = "/content/drive/MyDrive/rnv_pipeline/model"
experiment_name = ""
required_conda_env = ""
max_images_per_fold = 0
