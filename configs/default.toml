# Default editable pipeline configuration.
# Friends should usually copy this file, edit the copy, then pass it with:
#   ./run_main.sh --config configs/my_experiment.toml
#   ./run_visualize.sh --config configs/my_experiment.toml --experiment-name <name>

[train]
dataset = "tu"      # "dataset_tu", "dataset_drac", "tu", or "drac"
model_name = "deeplabv3"        # "unet", "unetplusplus", "deeplabv3plus", or "deeplabv3".
backbone = "efficientnet-b3"  # "efficientnet-b3", "inceptionv4", or "densenet169".
augment = true
aug_multiplier = 10
base_dir = "."
k_folds = 5
#only_fold = 5        # uncomment to train just this fold (1-indexed) instead of all k_folds
epochs = 100
batch_size = 8
grad_accum_steps = 4           # Effective training batch is batch_size * grad_accum_steps.
lr = 0.0001
use_amp = true
use_scheduler = true
scheduler_factor = 0.5
scheduler_patience = 5
min_lr = 0.0000001
patience = 25
num_workers = 4
threshold = 0.35
best_metric = "dice"              # Best-model metric: loss, dice, iou, precision, recall, specificity, or accuracy.
seed = 69
model_root = "model"
required_conda_env = "rnv"        # Optional. Set to your conda preference only if you want to enforce that env.
experiment_name = "tu_deeplabv3_effib3_t0.35"          # Empty string means auto-generate from config.

[visualize]
dataset = "drac"
model_name = "deeplabv3"   # Usually overwritten from model/<experiment_name>/config.json when available.
backbone = "efficientnet-b3"   # Usually overwritten from model/<experiment_name>/config.json when available.
base_dir = "."
k_folds = 5
batch_size = 8
threshold = 0.5
use_amp = true
model_root = "model"
experiment_name = "drac_deeplabv3plus_efficientnetb3"          # Empty string means auto-generate from config. Use the training experiment name.
required_conda_env = "rnv"        # Optional. Set to "eeg" only if you want to enforce that env.
max_images_per_fold = 0       # 0 means visualize all test images.
summarize_all_datasets = false
summary_only = false
setting_suffix = ""           # Optional. Shared suffix after "tu_" or "drac_" for cross-dataset summary.

apply_nearby_filter = true
# false writes to model/<experiment_name>/outputs; true writes to model/<experiment_name>/outputs_nearby.
# points_csv / points_image_name_template left blank: auto-resolved from `dataset` (tu vs drac)
# via utils/dataset_points.py, so switching `dataset` above no longer requires editing these too.
# Set explicitly here only to override the per-dataset default.
points_csv = ""
points_image_name_template = ""
radius_tolerance = 20     # Pixel radius around each representative point.

# Which localizer point set the filter uses, and therefore which output directory it writes to:
#   "multiple" -> every point the localizer emits, several per lesion  -> outputs_nearby_multiple
#   "single"   -> one representative point per lesion (clustered)      -> outputs_nearby_single
# Setting points_csv explicitly overrides this choice of file, but not the output directory.
points_mode = "multiple"
